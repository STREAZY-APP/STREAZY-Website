<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAZY - Redirecting...</title>
    <script>
        (function() {
            const userLang = navigator.language || navigator.userLanguage; 
            const langCode = userLang.split('-')[0].toLowerCase(); // Extrahiert "de", "en", etc.
            const supportedLanguages = ['de', 'en', 'es', 'it', 'fr','hi', 'nl', 'pl', 'pt'];
            let targetLang = 'en';
            if (supportedLanguages.includes(langCode)) {
                targetLang = langCode;
            }
            window.location.href = '/' + targetLang + '/';
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=/en/">
    </noscript>
</head>
<body style="background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <p>Redirecting to STREAZY...</p>
</body>
</html>
