<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ईमेल सत्यापित – Streazy</title>
  
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: url('/sign_in_background.png') no-repeat center center / cover;
    }

    .email-verified-page {
      width: 100%;
      max-width: 420px;
    }

    .email-verified-page h1 {
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      line-height: 1.15;
      margin-bottom: 1rem;
      font-weight: 700;
      color: black;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    .email-verified-page p {
      font-size: clamp(1rem, 4vw, 1.15rem);
      line-height: 1.5;
      margin: 0;
      color: black;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <main class="email-verified-page">
    <h1>ईमेल सफलतापूर्वक सत्यापित</h1>
    <p>
      आपके ईमेल पते की पुष्टि कर दी गई है।
      अब आप ऐप पर वापस जा सकते हैं।
    </p>
  </main>
</body>
</html>
